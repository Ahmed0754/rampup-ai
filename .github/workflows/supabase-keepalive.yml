name: Supabase keepalive

# Free-tier Supabase projects are paused after 7 days without activity, which takes the
# hostname offline and breaks the app and the weekly nudge. A cheap database read every
# few days keeps the project awake, and fails loudly if it has already been paused.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/progress_entries?select=id&limit=1" \
            || { echo "::error::Supabase is unreachable - the project may be paused. Restore it from the Supabase dashboard."; exit 1; }
