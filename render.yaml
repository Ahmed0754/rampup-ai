# Render Blueprint for the backend API (free tier).
# Render dashboard -> New -> Blueprint -> pick this repo. Secrets marked
# `sync: false` are prompted for on first deploy, never stored in git.
services:
  - type: web
    name: rampup-ai-api
    runtime: docker
    plan: free
    # Docker paths are relative to the repo root, not rootDir. rootDir just limits
    # auto-deploys to commits that touch backend/.
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Your Vercel URL, e.g. https://rampup-ai.vercel.app (comma-separate several).
      - key: CORS_ORIGINS
        sync: false
