<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RampUp AI - Explain</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0f0f0f;
        color: #fff;
        margin: 0;
        padding: 16px;
      }
      h2 {
        font-size: 12px;
        color: #a3a3a3;
        margin: 16px 0 4px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      h2:first-of-type {
        margin-top: 8px;
      }
      p {
        font-size: 13px;
        line-height: 1.5;
        margin: 0;
        white-space: pre-wrap;
      }
      ul {
        margin: 4px 0 0;
        padding-left: 18px;
        font-size: 13px;
      }
      .tag {
        display: inline-block;
        background: rgba(124, 58, 237, 0.2);
        color: #a78bfa;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
      }
      .loading {
        color: #888;
        font-size: 12px;
      }
      .error {
        color: #f87171;
        font-size: 13px;
      }
      code {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.9em;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        padding: 1px 4px;
      }
      .quote {
        color: #a3a3a3;
        border-left: 2px solid #262626;
        padding-left: 8px;
      }
      .tones {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      button {
        font: inherit;
        font-size: 12px;
        color: #d4d4d4;
        background: transparent;
        border: 1px solid #262626;
        border-radius: 8px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        color: #fff;
        border-color: #7c3aed;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      button.active {
        background: #7c3aed;
        border-color: #7c3aed;
        color: #fff;
        opacity: 1;
      }
      .reply-box {
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
        margin-top: 10px;
        background: #171717;
        border: 1px solid #262626;
        border-radius: 8px;
        padding: 10px;
      }
      .copy {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="content"><p class="loading">Explaining…</p></div>
    <div id="reply"></div>
    <script src="lib.js"></script>
    <script src="result.js"></script>
  </body>
</html>
